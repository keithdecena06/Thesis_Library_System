<!DOCTYPE html>
<html>
<head>
    <title>Library Exit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                        "Segoe UI", Roboto, sans-serif;
            background: #f2f2f7;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #1c1c1e;
        }

        .container {
            width: min(500px, 94vw);
            padding: 45px 34px;
            border-radius: 32px;
            background: #ffffffcc;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.08);
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        /* TITLE */
        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        /* STUDENT INFO BOX */
        .student-info {
            background: #f4f4f5;
            border: 1px solid #e5e5ea;
            padding: 22px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .student-info p {
            font-size: 14px;
            margin-bottom: 8px;
            color: #3a3a3c;
        }

        .student-info strong {
            color: #a20705;
        }

        /* INSTRUCTION */
        .instruction {
            font-size: 15px;
            color: #6e6e73;
            margin-bottom: 35px;
        }

        /* BUTTON */
        .tap-button {
            width: 100%;
            background: #a20705;
            color: #fff;
            padding: 18px 0;
            border: none;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease;
            box-shadow:
                0 0 12px rgba(225, 18, 15, 0.42),
                0 10px 22px rgba(58, 2, 2, 0.28);
        }

        .tap-button:active {
            transform: scale(0.97);
            box-shadow:
                0 0 8px rgba(225, 18, 15, 0.36),
                0 8px 18px rgba(58, 2, 2, 0.24);
        }

        /* FADE */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-height: 720px) {
            .container {
                padding: 35px 26px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ready to Exit?</h1>

        <div class="student-info">
            <p><strong>Student:</strong> {{ student.name }}</p>
            <p><strong>ID:</strong> {{ student.student_id }}</p>
            <p><strong>Program:</strong> {{ student.program_year_section }}</p>
        </div>

        <div class="instruction">
            <p>Please tap your RFID card to record your exit.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="tap-button">Tap Card to Exit</button>
        </form>
    </div>
</body>
</html>
