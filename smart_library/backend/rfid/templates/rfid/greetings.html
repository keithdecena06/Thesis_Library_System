<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Entry Confirmed</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: #f2f2f7;
            display: grid;
            place-items: center;
            color: #1c1c1e;
            overflow: hidden;
        }

        /* CARD */
        .container {
            width: min(480px, 92vw);
            padding: 45px 32px;
            border-radius: 32px;
            background: #ffffffcc;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.08);
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.6px;
        }

        /* GREETING BOX */
        .greeting {
            background: #f4f4f5;
            border: 1px solid #e5e5ea;
            padding: 22px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #a20705;
        }

        .instruction {
            font-size: 15px;
            color: #6e6e73;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* BUTTON */
        .tap-button {
            display: block;
            width: 100%;
            background: #a20705;
            color: #fff;
            padding: 18px 0;
            border-radius: 18px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            transition: transform .18s ease, box-shadow .18s ease;
            box-shadow:
                0 0 12px rgba(225, 18, 15, 0.42),
                0 10px 22px rgba(58, 2, 2, 0.28);
        }

        .tap-button:active {
            transform: scale(0.97);
            box-shadow:
                0 0 8px rgba(225, 18, 15, 0.36),
                0 8px 18px rgba(58, 2, 2, 0.24);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-height: 700px) {
            .container {
                padding: 35px 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Entry Recorded!</h1>

        <div class="greeting">
            {{ greeting }}, {{ student.name|truncatewords:1 }}!
        </div>

        <div class="instruction">
            <p>Please proceed to your study area.</p>
            <p>Enjoy your time at the library!</p>
        </div>

        <a href="{% url 'idle' %}" class="tap-button">
            Return to Main Screen
        </a>

    </div>

    <script>
        setTimeout(function() {
            window.location.href = "{% url 'idle' %}";
        }, 5000);
    </script>

</body>
</html>
