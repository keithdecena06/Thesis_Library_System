<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Tanauan City College - Smart Library System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                        "Segoe UI", Roboto, sans-serif;
            background: #f2f2f7;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #1c1c1e;
        }

        /* MAIN CONTAINER */
        .kiosk-welcome-container {
            width: min(520px, 94vw);
            padding: 50px 40px;
            border-radius: 32px;
            background: #ffffffcc;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.08);
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        /* LOGO */
        .logo-circle {
            width: 130px;
            height: 130px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid #a20705;
            box-shadow: 0 10px 25px rgba(162, 7, 5, 0.15);
        }

        .kiosk-logo {
            width: 90%;
            object-fit: contain;
        }

        /* TITLE */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: #6e6e73;
            margin-bottom: 25px;
        }

        /* INSTRUCTION */
        .instruction-text {
            font-size: 16px;
            margin-bottom: 35px;
        }

        .instruction-text strong {
            color: #a20705;
        }

        /* FORM */
        .rfid-form input {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            border-radius: 14px;
            border: 1px solid #e5e5ea;
            background: #f4f4f5;
            margin-bottom: 18px;
            text-align: center;
            outline: none;
            transition: 0.2s ease;
        }

        .rfid-form input:focus {
            border-color: #a20705;
            background: #fff;
        }

        /* BUTTON */
        button {
            width: 100%;
            background: #a20705;
            color: #fff;
            padding: 16px 0;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease;
            box-shadow:
                0 0 12px rgba(225, 18, 15, 0.42),
                0 10px 22px rgba(58, 2, 2, 0.28);
        }

        button:active {
            transform: scale(0.97);
            box-shadow:
                0 0 8px rgba(225, 18, 15, 0.36),
                0 8px 18px rgba(58, 2, 2, 0.24);
        }

        /* ERROR + PROCESS */
        .error {
            margin-top: 15px;
            color: #a20705;
            font-weight: 600;
        }

        .processing {
            margin-top: 15px;
            color: #6e6e73;
            font-weight: 600;
        }

        /* FADE */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SMALL HEIGHT FIX */
        @media (max-height: 720px) {
            .kiosk-welcome-container {
                padding: 40px 30px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="kiosk-welcome-container">
        <div class="logo-circle">
            <img src="{% static 'rfid/admin/css/logo.png' %}" alt="TCC Logo" class="kiosk-logo">
        </div>

        <h1>Tanauan City College</h1>
        <div class="subtitle">Smart Library System</div>
        <p class="instruction-text">Please tap your <strong>RFID Card</strong> to begin</p>

        <form class="rfid-form" method="post">
            {% csrf_token %}
            <input type="text" name="rfid_uid" placeholder="Enter RFID UID" required autofocus>
            <br>
            <button type="submit">Simulate Card Tap</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>

    <script>
        // Poll for RFID scans every 1 second
        setInterval(function() {
            fetch('/api/check_rfid_scan/')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        if (data.action === 'login') {
                            // Show processing message
                            const processingDiv = document.createElement('p');
                            processingDiv.className = 'processing';
                            processingDiv.textContent = 'Processing login...';
                            document.querySelector('.kiosk-welcome-container').appendChild(processingDiv);
                            // Redirect to reason page for login
                            setTimeout(() => {
                                window.location.href = data.redirect_url;
                            }, 500);
                        } else if (data.action === 'logout') {
                            // Show processing message
                            const processingDiv = document.createElement('p');
                            processingDiv.className = 'processing';
                            processingDiv.textContent = 'Processing logout...';
                            document.querySelector('.kiosk-welcome-container').appendChild(processingDiv);
                            // Redirect to rating page for logout
                            setTimeout(() => {
                                window.location.href = data.redirect_url;
                            }, 500);
                        }
                    } else if (data.status === 'error') {
                        // Show error message
                        const errorDiv = document.querySelector('.error') || document.createElement('p');
                        errorDiv.className = 'error';
                        errorDiv.textContent = data.message || 'Student not found';
                        document.querySelector('.kiosk-welcome-container').appendChild(errorDiv);
                        
                        // Clear error after 5 seconds
                        setTimeout(() => {
                            errorDiv.remove();
                        }, 5000);
                    }
                })
                .catch(error => {
                    console.log('Polling error:', error);
                });
        }, 1000);
    </script>
</body>
</html>
