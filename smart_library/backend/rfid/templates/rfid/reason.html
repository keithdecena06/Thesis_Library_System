<!DOCTYPE html>
<html>
<head>
    <title>Library Usage Reason</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: #f2f2f7;
            display: grid;
            place-items: center;
            color: #1c1c1e;
            overflow: hidden;
        }

        /* MAIN CARD */
        .container {
            width: min(480px, 92vw);
            background: #ffffffcc;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 32px;
            padding: 45px 34px 40px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.08);
            animation: fadeIn 0.4s ease;
        }

        /* TITLE */
        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.6px;
        }

        h2 {
            font-size: 16px;
            font-weight: 500;
            color: #6e6e73;
            margin-bottom: 30px;
        }

        /* OPTIONS */
        .reason-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 35px;
        }

        .reason-options label {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 18px;
            background: #f4f4f5;
            border: 1px solid #e5e5ea;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.18s ease;
        }

        .reason-options input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #c7c7cc;
            border-radius: 50%;
            position: relative;
            transition: all 0.2s ease;
        }

        .reason-options input[type="radio"]:checked {
            border-color: #a20705;
            background: #a20705;
        }

        .reason-options input[type="radio"]:checked + span,
        .reason-options label:has(input:checked) {
            background: rgba(162, 7, 5, 0.08);
            border-color: rgba(162, 7, 5, 0.25);
        }

        /* BUTTON */
        button {
            width: 100%;
            background: #a20705;
            color: #fff;
            padding: 18px 0;
            border: 0;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.2px;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease;

            box-shadow:
                0 0 12px rgba(225, 18, 15, 0.42),
                0 10px 22px rgba(58, 2, 2, 0.28);
        }

        button:active {
            transform: scale(0.97);
            box-shadow:
                0 0 8px rgba(225, 18, 15, 0.36),
                0 8px 18px rgba(58, 2, 2, 0.24);
        }

        /* ANIMATION */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SMALL DISPLAY */
        @media (max-height: 700px) {
            .container {
                padding: 35px 26px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, {{ student.name|truncatewords:1 }}!</h1>

        <h2>What brings you to the library today?</h2>

        <form method="post">
            {% csrf_token %}
            <div class="reason-options">
                <label>
                    <input type="radio" name="activity" value="Borrowing" required>
                    Borrowing Books
                </label>
                <label>
                    <input type="radio" name="activity" value="Reading">
                    Reading/Study
                </label>
                <label>
                    <input type="radio" name="activity" value="Facility">
                    Using Facilities
                </label>
            </div>

            <button type="submit">Continue</button>
        </form>
    </div>
</body>
</html>
